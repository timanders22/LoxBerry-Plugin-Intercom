[AUTHOR]
# You can also use a Team/Projekt Name here and a generic email address 
# like info@..., BUT NEVER CHANGE this information in future updates! It
# will be used to identify your Plugin, handle updates etc. If you change
# this information, LoxBerry could not identify your plugin and handle it as
# a different one - therefore updates will fail.
#
# Diese beiden Felder sind die KENNUNG des Plugins, kein Urhebervermerk.
# LoxBerry bildet daraus zusammen mit [PLUGIN] NAME die Kennzahl, unter der es
# Installation und Updates fuehrt.
#
# Bis 1.3.6 stand hier der Autor der Originalfassung - mit seiner privaten
# Mailadresse -, waehrend RELEASECFG auf sein Repository zeigte: LoxBerry
# haette diese Fortfuehrung beim naechsten Update-Lauf durch die
# Originalfassung ersetzt. Seit 1.6.0 traegt sie eine eigene Kennung, und das
# Auto-Update zeigt auf das eigene Repository.
#
# Die urheberrechtliche Nennung steht dort, wo sie hingehoert: in NOTICE, im
# README und auf der Hilfeseite.
NAME=Intercom LoxBerry Plugin Authors
EMAIL=intercom-loxberry@users.noreply.github.com

[PLUGIN]
# The version of your plugin - important if you would like to write an
# upgrade script.
VERSION=2.1.0

# Short name and prefered subfolder of your Plugin (do not use blanks - they
# will be filtered - and use lowercase only)! Used for script names in
# daemon or cron (NAME) and as unique installation folder. If these names
# already exist on the installation system, we will add 01, 02, 03 and so
# on. Therefore your script should check THESE TWO VARIABLES for figuring
# out subfolder and scriptnames! You will find this information in
# /data/system/plugindatabase.dat after installation!  BUT NEVER CHANGE this
# information in future updates! It will be used to identify your Plugin,
# handle updates etc. If you change this information, Loxberry could not
# identify your plugin and will handle it as a different one - therefore
# updates will definetely fail.
NAME=intercom
FOLDER=intercom

# Friendly Long Name of your Plugin - 25 Characters maximum! All others maybe 
# replaced by "...". You can use blanks, uppercase/lowercase etc.
TITLE=Intercom

[SYSTEM]
# Plugin Interface
# Do not change this if you are not knowing what you are doing!
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
CUSTOM_LOGLEVELS=false

[AUTOUPDATE]
# Beide Adressen zeigen auf das Repository DIESER Fortfuehrung, nicht auf das
# Original.
#
# Bis 1.3.6 stand hier bladerb/intercom22lox. LoxBerry haette damit beim
# naechsten Update-Lauf diese Fassung durch die Originalfassung ersetzt -
# samt Ruecknahme der Korrekturen an getpicture.php, videowebhook.php und
# live.php. In 1.6.0 war das Auto-Update deshalb vorsorglich abgeschaltet,
# solange es kein eigenes Repository gab. Jetzt gibt es eines.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Intercom/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Intercom/master/prerelease.cfg