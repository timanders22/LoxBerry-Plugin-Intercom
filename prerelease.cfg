[AUTOUPDATE]
# HINWEIS ZUM TAG-VORSATZ: Bis 2.1.8 trugen die Tags dieses Plugins keinen
# Vorsatz (2.1.8) - als einziges neben Midea2Lox (grosses V). Ab 2.1.9 gilt
# die Hauskonvention kleines v (v2.1.9). Die alten Tags bleiben unangetastet:
# installierte Anlagen ziehen ihre Archive daraus.
# Vorabfassungen. Wer in LoxBerry "Vorabversionen" eingeschaltet hat, bekommt
# das hier Genannte angeboten - alle anderen bleiben bei release.cfg.
#
# Solange hier dieselbe Fassung steht wie in release.cfg, wird niemandem etwas
# angeboten. Das ist der gewollte Ruhezustand.
#
# NEU 04.09.2026 (2.2.6): release.cfg nannte bis dahin "vier Stellen", die
# bei einer neuen Fassung zu aendern sind - und zaehlte diese Datei nicht mit.
# Es sind sieben: plugin.cfg VERSION; release.cfg VERSION, ARCHIVEURL,
# INFOURL; prerelease.cfg VERSION, ARCHIVEURL, INFOURL. Dazu der Ordnername,
# das Archiv daneben und der Tag auf GitHub. Wer der alten Aufzaehlung folgte,
# liess ausgerechnet die Datei stehen, die den Ruhezustand haelt.
# Werkzeuge/fassung_setzen.py setzt alle sieben.
#
# Die Adressen zeigen bewusst auf das EIGENE Repository. Ein fremdes duerfte
# hier nie stehen: LoxBerry vergleicht Fassungen als Zahl, und eine fremde
# waere moeglicherweise groesser - daraus wuerde ein stilles Downgrade.

VERSION=2.2.6
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Intercom/archive/refs/tags/v2.2.6.zip

INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Intercom/releases/tag/v2.2.6
