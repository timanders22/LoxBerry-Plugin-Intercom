; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Intercom"
K02 = "Holt ein Standbild von der <b>Loxone Intercom der zweiten Bauart</b> und legt es so ab, dass andere Programme es weiterverwenden können. Ausgelöst wird das aus Loxone heraus über einen virtuellen Ausgang; danach steht das Bild unter einer festen Adresse bereit, und auf Wunsch wird ein weiterer Webhook mit dieser Adresse aufgerufen."
K03 = "So gehen Sie vor"
K04 = "<b>Einstellungen:</b> Adresse, Benutzername und Passwort der Türstation eintragen und speichern."
K05 = "Beim ersten Speichern wird ein <b>Zugriffstoken</b> erzeugt. Es steckt in der Adresse, die Loxone aufruft — wer es neu würfelt, muss die Adresse im Miniserver anpassen."
K06 = "In Loxone Config einen <b>virtuellen Ausgang</b> auf die im Reiter <i>Einbindung in Loxone</i> angezeigte Adresse legen und ihn beim Klingeln auslösen."
K07 = "Klingeln und im Reiter <i>Logdateien</i> nachsehen, ob das Bild geholt wurde."
K08 = "Wo das Bild landet"
K09 = "Das jeweils letzte Bild liegt unter einem gleichbleibenden Namen, ältere wandern in ein Archiv. Wie viele aufgehoben werden, steht in den Einstellungen; ohne Grenze läuft die Karte irgendwann voll."
K10 = "Das Archiv liegt im Datenverzeichnis des Plugins und übersteht ein Update. Das <b>Protokoll dagegen nicht</b>: <span class='sm-mono'>log/</span> ist auf dem LoxBerry eine Ramdisk und wird bei jedem Neustart geleert."
K11 = "Wenn kein Bild kommt"
K12 = "Antwortet die Türstation überhaupt? Der Reiter <i>Test</i> holt ein Bild ohne Umweg über Loxone."
K13 = "Stimmen Benutzername und Passwort? Die Intercom antwortet auf falsche Zugangsdaten mit HTTP 401, und das steht im Protokoll."
K14 = "Ruft Loxone die Adresse mit dem <b>richtigen Token</b> auf? Ohne oder mit falschem Token kommt HTTP 403 zurück — von außen sieht das aus wie ein Fehler an der Türstation."
K15 = "Herkunft"
K16 = "Das Plugin ist aus einem Beitrag im Loxforum entstanden und war zunächst bewusst grob gebaut. Die Weboberfläche der Intercom ist von Loxone nicht als Schnittstelle vorgesehen; sie kann sich mit jeder Firmware ändern."
K17 = "Was ungeprüft ist"
K18 = "Ob eine bestimmte Firmware der Intercom weiterhin Standbilder auf diesem Weg herausgibt, lässt sich nur am Gerät feststellen. Bleibt das Bild leer, zeigt das Protokoll die Antwort der Türstation im Wortlaut."
