; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben. Attribute deshalb einfach quotieren.

[HILFE]
K01 = "Intercom"
K02 = "Holt ein Standbild von der <b>Loxone Intercom</b> und legt es so ab, dass andere Programme es weiterverwenden können. Ausgelöst wird das aus Loxone heraus über einen virtuellen Ausgang; danach steht das Bild unter einer festen Adresse bereit, und auf Wunsch wird ein weiterer Webhook mit dieser Adresse aufgerufen. Unterstützt werden <b>Intercom (Gen. 1)</b>, <b>Intercom Gen. 2</b> und <b>Intercom XL</b> — abgefragt wird bei allen derselbe Weg, es gibt daher keine Modellauswahl."
K03 = "So gehen Sie vor"
K04 = "<b>Einstellungen:</b> im Reiter <i>Einstellungen</i> die Adresse der Türstation eintragen und speichern. Benutzername und Passwort holt sich das Plugin aus den Miniserver-Daten des LoxBerry; nur wenn die Station eigene Zugangsdaten hat, tragen Sie sie in derselben Zeile ein."
K05 = "Beim ersten Öffnen dieser Seite wird ein <b>Zugriffstoken</b> erzeugt. Es steckt in jeder Adresse, die Loxone aufruft — wer es neu würfelt, muss die Adressen im Miniserver anpassen."
K06 = "In Loxone Config einen <b>virtuellen Ausgang</b> auf die im Reiter <i>Einbindung in Loxone</i> angezeigte Adresse legen und ihn beim Klingeln auslösen. Dort steht auch ein Knopf, der die fertige Importdatei für Loxone Config erzeugt, und die vollständige Baustein-Liste zum Nachbauen."
K07 = "Klingeln und im Reiter <i>Logdateien</i> nachsehen, ob das Bild geholt wurde."
K08 = "Wo das Bild landet"
K09 = "Das jeweils letzte Bild liegt unter einem gleichbleibenden Namen, ältere wandern in ein Archiv. Wie viel aufgehoben wird, steht in den Einstellungen — nach Tagen, nach Anzahl und nach Platz in Megabyte. Ohne Grenze läuft die Karte irgendwann voll."
K10 = "Das Archiv liegt im Datenverzeichnis des Plugins und übersteht ein Update. Das <b>Protokoll dagegen nicht</b>: <span class='sm-mono'>log/</span> ist auf dem LoxBerry eine Ramdisk und wird bei jedem Neustart geleert."
K11 = "Wenn kein Bild kommt"
K12 = "Der Reiter <i>Test</i> beantwortet ohne Umweg über Loxone, ob die Einrichtung trägt: Token, Zugangsdaten, Erreichbarkeit der Station, ffmpeg, MQTT-Gateway, Platz auf der Karte. Der Knopf <i>Jetzt vollständig prüfen</i> fragt dabei auch das Netz ab."
K13 = "Stimmen Benutzername und Passwort? Die Intercom antwortet auf falsche Zugangsdaten mit HTTP 401, und das steht in der Prüfzeile und im Protokoll."
K14 = "Ruft Loxone die Adresse mit dem <b>richtigen Token</b> auf? Ohne oder mit falschem Token kommt HTTP 403 zurück — von außen sieht das aus wie ein Fehler an der Türstation. Der Endpunkt beantwortet das auch ohne Auslösung: <span class='sm-mono'>getpicture.php?token=...&amp;selftest=1</span>."
K15 = "Herkunft"
K16 = "Das Plugin ist aus einem Beitrag im Loxforum entstanden und war zunächst bewusst grob gebaut. Die Weboberfläche der Intercom ist von Loxone nicht als Schnittstelle vorgesehen; sie kann sich mit jeder Firmware ändern."
K17 = "Was ungeprüft ist"
K18 = "Ob eine bestimmte Firmware der Intercom Standbilder unter <span class='sm-mono'>/jpg/image.jpg</span> herausgibt, lässt sich nur am Gerät feststellen — der Reiter <i>Test</i> misst es und sagt das Ergebnis. Ab Werk bleibt der bisherige Weg über den Videostrom eingestellt."
