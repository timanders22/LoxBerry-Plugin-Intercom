; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben. Attribute deshalb einfach quotieren.

[HILFE]
K30 = "Benutzername und Kennwort am Baustein"
K31 = "Kommt das Bild über den LoxBerry - über die Adressen dieses Plugins (Reiter <i>Einbindung in Loxone</i>, Schritt 5 und 6) oder über <span class='sm-mono'>/plugins/actikamera/cam_stream.php</span> des Plugins <b>ACTi Kamera</b> -, bleiben in den Eigenschaften der Intercom in Loxone Config (Peripherieobjekt, bei der Türsteuerung unter <i>Zugeordnete Intercom</i>) die Felder <i>Benutzername Kamera</i> und <i>Kennwort Kamera</i> leer (in der Projektdatei <span class='sm-mono'>VideoUser</span> und <span class='sm-mono'>VideoPwd</span>). Beide Plugins melden sich selbst bei der Kamera an und werten keine Anmeldung des Abrufers aus; geschützt ist die Adresse über das Token in ihr, beim ACTi-Plugin nur, wenn dort ein Stromkennwort gesetzt ist. Die Zugangsdaten zur Kamera liegen dann im Plugin - bei diesem im Reiter <i>Einstellungen</i> oder in den Miniserver-Daten des LoxBerry, beim ACTi-Plugin in dessen Reiter <i>Einstellungen</i> - und nicht in der Projektdatei. Ob die Adressen dieses Plugins wirklich keine Zugangsdaten tragen, misst die Zeile <i>Kommen die Adressen für Loxone ohne Zugangsdaten aus?</i> im Reiter <i>Test</i>."
K01 = "Intercom"
K02 = "Holt ein Standbild von der <b>Loxone Intercom</b> und legt es so ab, dass andere Programme es weiterverwenden können. Ausgelöst wird das aus Loxone heraus über einen virtuellen Ausgang; danach steht das Bild unter einer festen Adresse bereit, und auf Wunsch wird ein weiterer Webhook mit dieser Adresse aufgerufen. Unterstützt werden <b>Intercom (Gen. 1)</b>, <b>Intercom Gen. 2</b> und <b>Intercom XL</b>. Gemessen wird ausschließlich an einer <b>Intercom XL</b> — für die beiden anderen Stationen steht kein Gerät zur Verfügung; sie sollten laufen, nachgewiesen ist das aber nicht. Eine Modellauswahl gibt es nicht — wie das Bild geholt wird, ist eine Einstellung und keine Modellfrage: im Reiter <i>Einstellungen</i> steht unter <i>Wie das Bild geholt wird</i> die Wahl zwischen Videostrom, Standbild und „erst das Standbild, sonst den Strom“."
K03 = "So gehen Sie vor"
K04 = "<b>Einstellungen:</b> im Reiter <i>Einstellungen</i> die Adresse der Türstation eintragen und speichern. Benutzername und Passwort holt sich das Plugin aus den Miniserver-Daten des LoxBerry; nur wenn die Station eigene Zugangsdaten hat, tragen Sie sie in derselben Zeile ein."
K05 = "Beim ersten Öffnen dieser Seite wird ein <b>Zugriffstoken</b> erzeugt. Es steckt in jeder Adresse, die Loxone aufruft — wer es neu würfelt, muss die Adressen im Miniserver anpassen."
K06 = "In Loxone Config die Seite <i>Intercom</i> aus dem Reiter <i>Einbindung in Loxone</i> nachbauen (Schritt 9): Werte als einfache Virtuelle Eingänge (Namenstabelle, Teil B), Befehle über MQTT an den gemeinsamen Ausgang <i>LoxBerry MQTT-Gateway</i> (Teil C; Haken im Reiter <i>MQTT</i>, ab Werk aus). Die Adressen über HTTP (Schritte 1 bis 8) bleiben für bestehende Anlagen, den Baustein Türsteuerung und Fremdsysteme."
K07 = "Klingeln und im Reiter <i>Logdateien</i> nachsehen, ob das Bild geholt wurde."
K08 = "Wo das Bild landet"
K09 = "Das jeweils letzte Bild liegt unter einem gleichbleibenden Namen, ältere wandern in ein Archiv. Wie viel aufgehoben wird, steht in den Einstellungen — nach Tagen, nach Anzahl und nach Platz in Megabyte. Ohne Grenze läuft die Karte irgendwann voll."
K10 = "Das Archiv liegt unter <span class='sm-mono'>webfrontend/legacy/&lt;Ordner&gt;_data/</span> und übersteht ein Update — am Installer nachgemessen: er räumt beim Aktualisieren sieben Plugin-Verzeichnisse ab, dieses ist keines davon. <b>Es liegt dort allerdings ohne Anmeldung im Netz</b>; der Haken <i>Das Archiv nur mit Anmeldung herausgeben</i> im Reiter <i>Einstellungen</i> legt eine Zugriffssperre davor. Das <b>Protokoll übersteht ein Update nicht</b>: <span class='sm-mono'>log/</span> ist auf dem LoxBerry eine Ramdisk und wird bei jedem Neustart geleert."
K11 = "Wenn kein Bild kommt"
K12 = "Der Reiter <i>Test</i> beantwortet ohne Umweg über Loxone, ob die Einrichtung trägt: Token, Zugangsdaten, Erreichbarkeit der Station, ffmpeg, MQTT-Gateway, Platz auf der Karte. Der Knopf <i>Jetzt vollständig prüfen (mit Netz)</i> fragt dabei auch das Netz ab."
K13 = "Stimmen Benutzername und Passwort? Die Intercom antwortet auf falsche Zugangsdaten mit HTTP 401, und das steht in der Prüfzeile und im Protokoll."
K14 = "Ruft Loxone die Adresse mit dem <b>richtigen Token</b> auf? Ohne oder mit falschem Token kommt HTTP 403 zurück — von außen sieht das aus wie ein Fehler an der Türstation. Der Endpunkt beantwortet das auch ohne Auslösung: <span class='sm-mono'>getpicture.php?token=...&amp;selftest=1</span>."
K15 = "Herkunft"
K16 = "Das Plugin ist aus einem Beitrag im Loxforum entstanden und war zunächst bewusst grob gebaut. Die Weboberfläche der Intercom ist von Loxone nicht als Schnittstelle vorgesehen; sie kann sich mit jeder Firmware ändern."
K17 = "Was ungeprüft ist"
K18 = "Ob eine bestimmte Firmware der Intercom Standbilder unter <span class='sm-mono'>/jpg/image.jpg</span> herausgibt, lässt sich nur am Gerät feststellen — der Reiter <i>Test</i> misst es und sagt das Ergebnis. Ab Werk bleibt der bisherige Weg über den Videostrom eingestellt."
K19 = "MQTT-Gateway V2: derselbe Name aus drei Quellen"
K20 = "Gateway V2 bildet aus drei Stellen denselben Namen <span class='sm-mono'>&lt;Präfix&gt;_ai_count</span>: aus dem Thema <span class='sm-mono'>&lt;Präfix&gt;/ai_count</span>, aus dem Feld count im Thema <span class='sm-mono'>&lt;Präfix&gt;/ai</span> und aus ai@@count im Klingelthema. Die Werte sind gleich. Haken Sie in den <i>Subscriptions</i> nur einen davon an, am besten das Thema ai_count - sonst speist ein Eingang aus zwei Quellen."
K21 = "Beim Klingeln melden: SignalBot und Sprachsteuerung"
K22 = "Im Reiter <i>Einstellungen</i> unter <i>Beim Klingeln melden</i> lassen sich zwei Wege einschalten, beide ab Werk aus: eine Signal-Nachricht über das Plugin <b>SignalBot</b> (Text und ein Bildlink, 24 Stunden und fünf Abrufe gültig) und eine Ansage über das Plugin <b>Sprachsteuerung</b>. Quelle ist jeweils der Endpunkt des anderen Plugins auf diesem LoxBerry (<span class='sm-mono'>/plugins/&lt;Ordner&gt;/index.php</span> mit <span class='sm-mono'>aktion=senden</span> bzw. <span class='sm-mono'>aktion=sprechen</span>); einzutragen sind dessen Ordner und dessen Zugriffstoken. Gemeldet wird nur bei den eingetragenen Auslösern (ab Werk <span class='sm-mono'>klingel</span>, also <span class='sm-mono'>&amp;trigger=klingel</span>), höchstens einmal je 60 Sekunden und Station, und auch dann, wenn die Station kein Bild liefert (dann ohne Bild). Gerufen wird nach der Antwort an Loxone. Fehlt das andere Plugin oder schweigt es, läuft das Klingeln wie ohne die Einstellung weiter; das Protokoll nennt den Grund, und der Reiter <i>Test</i> zeigt die Zeile gelb. Die eigene Ansage (gemeinsame Sprachausgabe) kennt seit 2.2.24 auch <b>Sonos4Lox</b> und <b>SonoX</b> (ab Werk nicht gewählt); <b>SonoX schickt den Ansagetext an Google</b> und antwortet erst nach der Wiedergabe (bis 30 s)."
K23 = "Lebenszeichen status/ok"
K24 = "Mit MQTT fragt das Plugin die Türstation einmal je Minute kurz an (Kopfzeilen, kein Bild, kein Archiv). status/ok ist 1, solange die Station in den letzten drei Minuten geantwortet hat - beim Klingeln, bei einer Aufnahme oder bei dieser Probe. Seit 2.2.24 zählt der Reiter Test unter MQTT-Gateway V2 nach, ob alle Datenpunkte der Hakenliste angehakt sind und „Noncached“ stimmt."
K25 = "Livebild: Grenzen"
K26 = "Ein Abruf des Livebilds (Reiter <i>Live</i> oder <span class='sm-mono'>mjpgproxy.php</span>) läuft höchstens <b>10 min</b>, danach endet der Strom; neu laden beginnt einen neuen Abruf. Höchstens <b>3 Leser</b> gleichzeitig - der vierte bekommt HTTP 503 mit <span class='sm-mono'>Retry-After: 30</span>, der Grund steht im Rumpf und in der Kopfzeile <span class='sm-mono'>X-Intercom-Grund</span> und einmal je Stunde im Protokoll. Beide Grenzen sind fest. Die Videoaufzeichnung belegt keinen Leserplatz. Wie viele Leser gerade verbunden sind, zeigt der Reiter <i>Test</i>."
K27 = "Befehle über MQTT"
K28 = "Seit 2.2.23 nimmt das Plugin Foto, Foto ohne Meldung und Video auch über MQTT an: <span class='sm-mono'>&lt;Präfix&gt;/befehl/&lt;Nr&gt;/foto</span>, <span class='sm-mono'>…/foto_ohne_meldung</span>, <span class='sm-mono'>…/video</span> (Wert = Sekunden). Die gemeinsame Befehlsbrücke prüft und startet einen kurzen Auftrag, der dasselbe tut wie die HTTP-Adresse. Beide Haken im Reiter <i>MQTT</i> sind ab Werk aus; ein Foto mit Klingel-Meldung braucht den zweiten."
K29 = "<b>Mehrere Lautsprecher gleichzeitig</b> (seit 2.2.24, Sprachmodul 1.2.1): Unter der Ausgabeart (jetzt „Ziel 1“) steht die Tabelle <i>Weitere Ausgabeziele (gleichzeitig)</i> – bis zu 6 Ziele insgesamt, zum Beispiel Loxone Music Server, Google-Lautsprecher (Chromecast 4 Lox NG) und Amazon Echo (Alexa-NG). Jede Ansage geht gleichzeitig an Ziel 1 und an jedes eingeschaltete Ziel der Tabelle; scheitert eines, sprechen die anderen trotzdem, und die Ansage gilt als gesendet, sobald eines gesprochen hat (Protokoll und Reiter Test nennen jedes Ziel). Ist Ziel 1 aus, spricht keines; mit dem Original-Audioserver als Ziel 1 gehen keine weiteren Ziele. Neues Ziel: die leere Zeile ausfüllen und speichern. Mehrere Zonen desselben Music Servers bzw. mehrere Echos gehören in EIN Ziel (Zonenliste, Kommaliste, gruppe:&lt;Name&gt;). Das Sprechtoken steht einmal oben und gilt für alle Ziele dieser Art. Im Reiter Test spricht <i>Testansage</i> an alle Ziele, <i>Testansage an Ziel n</i> nur an dieses. Vor einem Zurückgehen auf eine Fassung vor 2.2.24 die weiteren Ziele entfernen – ältere Fassungen kennen die Liste nicht und fielen beim Laden auf die Werkseinstellung der Sprachausgabe zurück."
