BS_SCHRITT1 = "Im Plugin Reiter „%s“ die Türstation eintragen (Name, Adresse; die Zugangsdaten holt das Plugin vom Miniserver), speichern. Reiter „%s“ → „%s“: die Zeile der Station ist grün."
BS_SCHRITT2 = "Reiter „%s“: „%s“ ist bei einer Neuinstallation an (nach einem Update bleibt es, wie es war – prüfen). Dort „%s“ und – nur, wenn Loxone die Klingel-Meldungen auslösen soll – „%s“ setzen und speichern; beide ab Werk aus. Gateway-Fassung 1: das Abo %s eintragen (die Datei liegt bei; Reiter „%s“ nennt es). Fassung 2: die Haken laut Namenstabelle setzen, bei %s zusätzlich „Noncached“."
BS_SCHRITT3 = "In Loxone Config unter Peripherie → Virtuelle Eingänge die Virtuellen Eingänge Nr. 1–4 und den Virtuellen Texteingang Nr. 5 anlegen, Name genau wie in der Tabelle (Kopierknopf in der Namenstabelle im Reiter „%s“); „Als Digitaleingang verwenden“ nicht anhaken. Der LoxBerry-Benutzer am Miniserver braucht Rechte auf die Eingänge. Wer die Seite aus dem Musterprojekt kopiert, bekommt die Eingänge mit."
BS_SCHRITT4 = "Seite „Intercom“ anlegen. Die 3 Befehle Nr. 17, 23, 26 an den gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ (Seite „LoxBerry MQTT-Gateway“ des Musterprojekts) hängen, Befehl bei EIN wie in der Tabelle, nie retain – oder im Reiter „%s“ die „%s“ einmal importieren (eigener Ausgang „Intercom MQTT-Befehle“). Dazu „Konstante 1“. Den Virtuellen Texteingang %s an Nr. 12 V4 legen."
BS_SCHRITT5 = "Benachrichtigung „Meldung Plugin gestört (Intercom)“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Liste. Virtuelle Eingänge anlegen: Schalter „Klingel-Meldungen aus (Intercom)“, Tasten „Foto jetzt (Intercom)“, „Briefkasten (eigene Quelle)“, „Klingelzähler löschen (Intercom)“. „Türklingel (eigene Quelle)“ und „Niemand zu Hause (eigene Quelle)“ im eigenen Projekt durch die eigene Klingel und die eigene Anwesenheit ersetzen."
BS_SCHRITT6 = "Übrige Bausteine über die Baustein-Suche (F5), Parameter wie in der Liste, von oben nach unten verbinden; jedes UND und ODER hat zwei Eingänge. Analogwertvalidierung Nr. 7: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an und die Meldung löst nie aus). UND Nr. 16, Eingang I2: auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Aufwärtszähler Nr. 27: Remanenz einschalten. Status „Klingel und Bilder (Intercom)“: vorher einmal „+“ klicken (V5); die Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt. „In Visualisierung verwenden“ an beiden Status."
BS_SCHRITT7 = "Speichern und übertragen. Probe: „Zustand (Intercom)“ zeigt „läuft – Türstation antwortet“; %s zählt jede Minute weiter. „Foto jetzt“ drücken – im Plugin Reiter „%s“ liegt ein neues Bild, es kommt keine Ansage."
