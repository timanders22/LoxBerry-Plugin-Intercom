; Sprachdatei Deutsch.
; VON HAND GEPFLEGT - seit 2.2.6.
;
; Bis 2.2.5 stand hier "Erzeugt von Pruefung-Intercom-2.2.0/
; sprache_erzeugen.py - EINE Quelle fuer beide Sprachen. Von Hand
; geaenderte Werte gehen beim naechsten Lauf verloren". Gemessen am
; 04.09.2026: der Erzeuger kennt 343 Schluessel, ausgeliefert sind 359.
; SECHZEHN Schluessel stehen nur hier - die gesamte Oberflaeche zum
; Sichern und Zurueckspielen und die vier MQTT-Abo-Texte. Ein Lauf haette
; sie geloescht; seine eigene Wache verwirft ausserdem jede Entitaet und
; sein Pfad zeigt auf einen Ordner, den es nicht mehr gibt. Die Zusage
; war zur Falle geworden.
;
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst
; keine.
;
; Auszeichnung: die meisten Werte laufen durch ic_txt() und damit durch
; die Maskierfunktion - dort stuende jedes Element woertlich auf dem
; Bildschirm. NEUN Werte tragen bewusst Auszeichnung und duerfen deshalb
; NIE ueber ic_txt()/ic_txtf() gehen:
;   ohne Platzhalter, ueber ic_roh():  MQTT_ABO_GEMESSEN, MQTT_ABO_PFLICHT,
;     MQTT_ABO_UNBEKANNT, MQTT_ABO_V2, SICH_ABGELEHNT, SICH_ERKLAERUNG,
;     SICH_WARNUNG
;   mit Platzhaltern, ueber ic_rohf(): ARCHIVSCHUTZ_TEXT, BILDSCHUTZ_TEXT
; Die letzten beiden liefen bis zur Berichtigung am 04.09.2026 ueber
; ic_txtf(); die gerenderte Seite zeigte "&lt;b&gt;" im Klartext. Wer einen
; zehnten anlegt, waehlt danach: mit Platzhalter ic_rohf(), ohne ic_roh().
; Gegenprobe ist rendern.py - dort darf kein &lt;b&gt; stehen.
;
; Zeichen-Entitaeten gibt es hier nicht (Hausbeschluss 14.08.2026):
; direkte UTF-8-Zeichen. Erlaubt bleiben nur die sieben, die HTML selbst
; braucht - &nbsp; &shy; &amp; &lt; &gt; &quot; &apos;. Bis 2.2.5 standen
; hier zusaetzlich — und &#8209;.

