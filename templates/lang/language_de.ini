Z12 = "Status | Zustand (Intercom) | Zeilen: V1 = 1 „das Plugin meldet sich seit mindestens 5 Minuten nicht – LoxBerry, MQTT-Gateway (Fassung 1: Abo %s, Fassung 2: Haken) und im Plugin Reiter MQTT ‚Meldungen per MQTT verschicken‘ prüfen; dann Reiter Test ‚Jetzt vollständig prüfen (mit Netz)‘“; V2 = 0 „die Türstation antwortet seit über 3 Minuten nicht (zuletzt gemeldet: <v4>) – Strom und Netz der Intercom prüfen; im Plugin Reiter Test ‚Jetzt vollständig prüfen (mit Netz)‘“; ohne Bedingung „läuft – Türstation antwortet, Lebenszeichen <v3>“; Visualisierung EIN | V1 = Ausgang E von #7, V2 = #1, V3 = #2, V4 = #5"
Z13 = "Virtueller Eingang (Taste) | Türklingel (eigene Quelle) | 1 = es klingelt (weitere Instanz, derselbe Platzhalter wie auf „Dashboard Steuerung“, „Heimkino Steuerung“ und „Kodi-NG Wiedergabe“); im eigenen Projekt die Leitung vom eigenen Klingeltaster bzw. vom Klingelausgang des Bausteins Türsteuerung statt dieser Taste an Nr. 14 legen | —"
