Z20 = "Virtueller Eingang (Taste) | Briefkasten (eigene Quelle) | 1 = Post ist da; in der App zum Ausprobieren; im eigenen Projekt die Leitung vom eigenen Briefkastenkontakt oder Bewegungsmelder statt dieser Taste an Nr. 21 legen | —"
Z21 = "ODER | Foto von Hand oder Briefkasten (Intercom) | — | I1 = #19, I2 = #20"
