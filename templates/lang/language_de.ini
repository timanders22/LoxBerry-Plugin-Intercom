Z24 = "Virtueller Eingang (Schalter) | Niemand zu Hause (eigene Quelle) | 1 = alle sind weg (weitere Instanz, derselbe Platzhalter wie auf „Alexa NG“ und „Kodi-NG Wiedergabe“); im eigenen Projekt die Leitung von der eigenen Anwesenheit statt dieses Schalters an Nr. 25 legen | —"
Z25 = "UND | Geklingelt, niemand zu Hause (Intercom) | — | I1 = #14, I2 = #24"
Z26 = "Virtueller Ausgang Befehl (Vorlage „LoxBerry MQTT-Gateway“, MQTT) | %s | Befehl bei EIN: publish %s 10 (nie retain); 10 Sekunden Video der Station 1 ins Videoarchiv (erlaubt 1 bis 300 – die Zahl im Befehl ändern); läuft schon eine Aufnahme, lehnt das Plugin ab; Haken wie Nr. 23 | Eingang = #25"
Z27 = "Aufwärtszähler | Klingeln in Abwesenheit (Intercom) | Limit 1000, Remanenz ein (der Stand überlebt einen Neustart des Miniservers); zählt jedes Klingeln, während niemand zu Hause ist | C = #25, Off = #28"
Z28 = "Virtueller Eingang (Taste) | Klingelzähler löschen (Intercom) | in der App: setzt „Klingeln in Abwesenheit“ auf 0 | —"
Z29 = "Status | Klingel und Bilder (Intercom) | Zeilen: V1 > 0 „während niemand zu Hause war, hat es <v1> mal geklingelt – Fotos im Plugin Reiter Bilderarchiv, Videos im Reiter Videoarchiv; ‚Klingelzähler löschen‘ setzt zurück“; V4 = 1 „Klingel-Meldungen aus – beim Klingeln nur ein Foto ins Archiv; <v2> Bilder im Archiv“; V5 = 1 „niemand zu Hause – beim Klingeln Foto und 10 s Video; <v2> Bilder im Archiv“; V3 < 0 „<v2> Bilder im Archiv (Objekterkennung aus)“; ohne Bedingung „<v2> Bilder im Archiv; zuletzt erkannt: <v3> Objekte“; Visualisierung EIN | V1 = Ausgang V von #27, V2 = #3, V3 = #4, V4 = #15, V5 = #24"
BS_H1 = "Ansage und Signal-Nachricht beim Klingeln stellt man im Plugin ein (Reiter „%s“, Abschnitte „%s“ und „%s“; beides ab Werk aus). Loxone löst nur aus: „%s“ schickt den Befehl foto mit dem Auslöser „klingel“ und wirkt nur mit dem zweiten Haken „%s“ – ohne ihn entsteht KEIN Foto. Der Schalter „Klingel-Meldungen aus (Intercom)“ leitet das Klingeln auf „%s“ um – so bleibt es nachts still, das Foto kommt trotzdem."
BS_H2 = "Die Sprachausgabe ist das gemeinsame Sprachmodul der Hausplugins; eine Ruhezeit hat Intercom nicht – dafür ist der Schalter da."
BS_H3 = "Zu Nr. 7: Ein virtueller Eingang behält seinen letzten Wert; nur der stehende Laufzähler verrät, dass das Plugin schweigt. Die Meldung kommt nach etwa 13 Minuten ohne Antwort der Türstation bzw. 15 Minuten ohne Lebenszeichen, nicht bei jedem Neustart."
BS_H4 = "Zu Nr. 15–23: Gemeldet wird nur bei den Auslösern im Reiter „%s“ (ab Werk „klingel“) – der zweite Befehl „%s“ mit dem Auslöser „hand“ macht die Sperre aus Loxone möglich. Wer „hand“ in die Liste der Auslöser schreibt, bekommt auch dort Meldungen."
BS_H5 = "Zu Nr. 17: Derselbe Befehl löst auch die Meldungen beim Klingeln aus – SignalBot, Sprachsteuerung und die eigene Ansage; dafür ist kein eigener Baustein nötig, die Verzögerung Nr. 14 gilt auch für sie. Mit eingeschalteter Objekterkennung nennt die Meldung bis zu drei erkannte Objekte und kommt dafür höchstens 5 Sekunden später. Im eigenen Haus nur einen Weg wählen – entweder die Klingel-Meldungen im Intercom-Plugin oder die Klingel-Bausteine der Seiten „SignalBot“ und „Sprachsteuerung“."
BS_H6 = "Zu Nr. 25–27: Video nur, wenn niemand zu Hause ist – wer jedes Klingeln filmen will, legt Nr. 26 an Nr. 14 statt an Nr. 25. Der Zähler zählt Flanken (ein langer Klingeldruck zählt einmal); „Klingelzähler löschen (Intercom)“ setzt ihn zurück."
BS_H7 = "Mehrere Türstationen: je Station eigene Befehle mit der Nummer der Station im Thema (%s/befehl/2/foto …; die Nummer ist die Zeile im Reiter Einstellungen) und dieselben Bausteine Nr. 13–26 mit der Klingel dieser Station; die Vorlage „Intercom MQTT-Befehle“ legt sie je Station an. %s steht nur auf 1, wenn alle Stationen antworten."
BS_H8 = "Bild und Livebild für den Baustein Türsteuerung: Adressen in Schritt 5 und 6 dieses Reiters (nicht Teil dieser Seite; sie verlangen das Zugriffstoken). Nach „%s“ diese Adressen in Loxone nachziehen – die Befehle über MQTT brauchen kein Token."
BS_H9 = "Nicht auf dieser Seite: %s und %s (Zeitstempel und überholter Herzschlag; unter Gateway V2 nicht anhaken), die Text-Themen (Bildadresse, Auslöser, Video, Objekterkennung, Zeitraffer), status/befehle und die Quittungen der Befehle, Webhooks, Anzeigegerät, Zeitraffer und Aufräumen – das erledigt das Plugin selbst."
MQ_AUS = "Im Reiter %s ist %s aus – ohne MQTT kommen weder Werte noch Befehle an."
MQ_A = "A: Werte über das MQTT-Gateway"
