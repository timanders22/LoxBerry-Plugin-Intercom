Z15 = "Virtueller Eingang (Schalter) | Klingel-Meldungen aus (Intercom) | 1 = beim Klingeln nur ein Foto ins Archiv, keine Ansage und keine Signal-Nachricht (z. B. nachts); 0 = Meldungen, wie sie im Plugin eingeschaltet sind | —"
Z16 = "UND | Klingeln mit Meldung (Intercom) | — (I2 negiert: in Config auf den Eingangspunkt klicken, es erscheint ein kleiner Kreis) | I1 = #14, I2 = #15 (negiert)"
Z17 = "Virtueller Ausgang Befehl (Vorlage „LoxBerry MQTT-Gateway“, MQTT) | %s | Befehl bei EIN: publish %s 1 (nie retain); Foto der Station 1 ins Archiv mit dem Auslöser „klingel“ – löst damit auch die im Plugin eingeschalteten Klingel-Meldungen aus (SignalBot, Sprachsteuerung, eigene Ansage; höchstens eine je 60 s); wirkt nur mit den Haken „Befehle über MQTT annehmen“ und „Klingel-Meldungen über MQTT auslösen“ (Reiter MQTT) – ohne den zweiten entsteht KEIN Foto; wie und wo gesprochen wird, stellt man im Plugin ein, Loxone löst nur aus | Eingang = #16"
