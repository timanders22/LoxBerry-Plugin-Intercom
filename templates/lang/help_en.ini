; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Intercom"
K02 = "Fetches a still image from the <b>Loxone Intercom, second generation</b> and stores it so that other programs can use it. It is triggered from Loxone through a virtual output; afterwards the image is available at a fixed address, and on request a further webhook is called with that address."
K03 = "How to proceed"
K04 = "<b>Settings:</b> enter the address, user name and password of the door station and save."
K05 = "On the first save an <b>access token</b> is generated. It is part of the address Loxone calls — if you roll a new one, you have to adjust the address on the Miniserver."
K06 = "In Loxone Config, point a <b>virtual output</b> at the address shown on the <i>Loxone integration</i> tab and trigger it when the doorbell rings."
K07 = "Ring the bell and check on the <i>Log files</i> tab whether the image was fetched."
K08 = "Where the image ends up"
K09 = "The most recent image is kept under a constant name, older ones move into an archive. How many are kept is set in the settings; without a limit the card fills up eventually."
K10 = "The archive lives in the plugin's data directory and survives an update. The <b>log does not</b>: <span class='sm-mono'>log/</span> is a RAM disk on the LoxBerry and is cleared on every restart."
K11 = "If no image arrives"
K12 = "Does the door station answer at all? The <i>Test</i> tab fetches an image without going through Loxone."
K13 = "Are the user name and password right? The Intercom answers wrong credentials with HTTP 401, and that appears in the log."
K14 = "Does Loxone call the address with the <b>correct token</b>? Without a token, or with the wrong one, HTTP 403 comes back — from the outside that looks like a fault at the door station."
K15 = "Origin"
K16 = "The plugin grew out of a post in the Loxforum and was deliberately rough at first. The web interface of the Intercom is not intended by Loxone as an interface; it may change with any firmware."
K17 = "What has not been tested"
K18 = "Whether a particular Intercom firmware still hands out still images this way can only be established on the device itself. If the image stays empty, the log shows the door station's reply verbatim."
