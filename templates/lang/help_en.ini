; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped. Attributes are therefore
; single quoted.

[HILFE]
K01 = "Intercom"
K02 = "Fetches a still image from the <b>Loxone Intercom</b> and stores it so that other programs can use it. It is triggered from Loxone through a virtual output; afterwards the image is available at a fixed address, and on request a further webhook is called with that address. Supported are <b>Intercom (gen. 1)</b>, <b>Intercom gen. 2</b> and <b>Intercom XL</b> — all three are queried the same way, so there is no model selection."
K03 = "How to proceed"
K04 = "<b>Settings:</b> on the <i>Settings</i> tab enter the address of the door station and save. The plugin takes user name and password from the LoxBerry Miniserver data; only if the station has its own credentials do you enter them in the same row."
K05 = "An <b>access token</b> is created when this page is opened for the first time. It is part of every address Loxone calls — if you roll a new one, you have to adjust the addresses on the Miniserver."
K06 = "In Loxone Config, point a <b>virtual output</b> at the address shown on the <i>Loxone integration</i> tab and trigger it when the doorbell rings. That tab also carries a button which builds the ready-made import file for Loxone Config, and the complete list of blocks to rebuild."
K07 = "Ring the bell and check on the <i>Log files</i> tab whether the image was fetched."
K08 = "Where the image ends up"
K09 = "The most recent image is kept under a constant name, older ones move into an archive. How much is kept is set in the settings — by days, by count and by size in megabytes. Without a limit the card fills up eventually."
K10 = "The archive lives in the plugin's data directory and survives an update. The <b>log does not</b>: <span class='sm-mono'>log/</span> is a RAM disk on the LoxBerry and is cleared on every restart."
K11 = "If no image arrives"
K12 = "The <i>Test</i> tab answers without going through Loxone whether the setup holds: token, credentials, reachability of the station, ffmpeg, MQTT gateway, free space on the card. The button <i>Run full check now</i> also queries the network."
K13 = "Are the user name and password right? The Intercom answers wrong credentials with HTTP 401, and that appears in the check line and in the log."
K14 = "Does Loxone call the address with the <b>correct token</b>? Without a token, or with the wrong one, HTTP 403 comes back — from the outside that looks like a fault at the door station. The endpoint answers this without triggering anything: <span class='sm-mono'>getpicture.php?token=...&amp;selftest=1</span>."
K15 = "Origin"
K16 = "The plugin grew out of a post in the Loxforum and was deliberately rough at first. The web interface of the Intercom is not intended by Loxone as an interface; it may change with any firmware."
K17 = "What has not been tested"
K18 = "Whether a particular Intercom firmware hands out still images at <span class='sm-mono'>/jpg/image.jpg</span> can only be established on the device itself — the <i>Test</i> tab measures it and states the result. By default the previous path through the video stream stays selected."
