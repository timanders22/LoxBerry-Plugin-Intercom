[AUTOUPDATE]
# HINWEIS ZUM TAG-VORSATZ: Bis 2.1.8 trugen die Tags dieses Plugins keinen
# Vorsatz (2.1.8) - als einziges neben Midea2Lox (grosses V). Ab 2.1.9 gilt
# die Hauskonvention kleines v (v2.1.9). Die alten Tags bleiben unangetastet:
# installierte Anlagen ziehen ihre Archive daraus.
# Diese Datei fragt LoxBerry ab, wenn Auto-Update eingeschaltet ist.
#
# Bei jeder neuen Fassung vier Stellen aendern: plugin.cfg VERSION, hier
# VERSION, beide Adressen unten und der Tag auf GitHub. LoxBerry liest DIESE
# Datei aus dem Zweig, holt das Archiv aber vom TAG - stehen beide
# auseinander, laedt das Auto-Update einen alten Stand.
#
# Die Adressen zeigen bewusst auf das EIGENE Repository. Bis 1.3.6 standen
# sie auf bladerb/intercom22lox, also auf das Original: dort liegt eine
# aeltere Fassung, und LoxBerry haette diese Fortfuehrung beim naechsten
# Update-Lauf durch sie ersetzt - samt Ruecknahme aller Korrekturen.

# Fassung des Plugins - muss mit der plugin.cfg uebereinstimmen.
VERSION=2.1.11
# Adresse des ZIP-Archivs.
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Intercom/archive/refs/tags/v2.1.11.zip

# Adresse mit weiteren Angaben zu dieser Fassung.
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Intercom/releases/tag/v2.1.11
